# Construye las 3 imágenes y las publica en GitHub Container Registry (ghcr.io)
# cada vez que se hace push a main (o manualmente desde la pestaña Actions).
name: Publicar imágenes Docker

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Pruebas P1
        working-directory: p1-champions
        run: pip install -r requirements-dev.txt && pytest -q
      - name: Pruebas P2
        working-directory: p2-marketing
        run: pip install -r requirements-dev.txt && pytest -q

  imagenes:
    needs: pruebas
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - nombre: p1-champions
            contexto: p1-champions
          - nombre: p1-mock-api
            contexto: p1-champions/mock_api
          - nombre: p2-marketing
            contexto: p2-marketing
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Nombre de la imagen en minúsculas
        run: echo "IMAGEN=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${{ matrix.nombre }}" >> "$GITHUB_ENV"
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.contexto }}
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGEN }}:latest
            ${{ env.IMAGEN }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=${{ matrix.nombre }}
          cache-to: type=gha,mode=max,scope=${{ matrix.nombre }}
